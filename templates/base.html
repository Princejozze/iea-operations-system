<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}IEA Operations{% endblock %}</title>
  {% load static %}

  <!-- Self-hosted, not CDN-linked: one less external dependency on a
       slow link, and no dependency on a CDN being reachable at all. -->
  <link rel="stylesheet" href="{% static 'vendor/bootstrap/css/bootstrap.min.css' %}">
  <link rel="stylesheet" href="{% static 'css/custom.css' %}">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="/">IEA Operations</a>
      {% if user.is_authenticated %}
      <div class="d-flex text-light align-items-center">
        <span class="me-3">{{ user.get_full_name|default:user.username }} — {{ user.get_role_display }}</span>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button class="btn btn-sm btn-outline-light" type="submit">Log out</button>
        </form>
      </div>
      {% endif %}
    </div>
  </nav>

  <main class="container my-4">
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags }}">{{ message }}</div>
      {% endfor %}
    {% endif %}
    {% block content %}{% endblock %}
  </main>

  <script src="{% static 'vendor/bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  <script src="{% static 'vendor/htmx/htmx.min.js' %}"></script>
</body>
</html>
