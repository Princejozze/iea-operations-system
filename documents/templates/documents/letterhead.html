<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ title }}</title>
  {# Self-contained on purpose: no CDN, no static files, so it renders identically in an email, a browser and the PDF writer. #}
  <style>
    body { font-family: Arial, Helvetica, sans-serif; font-size: 11pt; color: #1a1a1a; margin: 0; padding: 0; }
    h2 { font-size: 13pt; margin: 18px 0 8px 0; }
    table.items { width: 100%; border-collapse: collapse; margin: 12px 0; }
    table.items th, table.items td { border: 1px solid #888; padding: 6px 8px; text-align: left; vertical-align: top; font-size: 10pt; }
    table.items th { background-color: #eee; }
    td.num, th.num { text-align: right; white-space: nowrap; }
    .signoff { margin-top: 28px; }
    .sigline { margin-top: 34px; }
  </style>
</head>
<body>
  {% include "documents/_letterhead.html" %}
  {% block body %}{% endblock %}
</body>
</html>
